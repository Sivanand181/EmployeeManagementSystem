<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar input {
            padding: 10px;
            width: 280px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .form-card {
            display: none;
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-grid input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .save-btn {
            margin-top: 15px;
            background: #16a34a;
            color: white;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            margin-left: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Management System</h1>
</header>

<div class="container">

    <div class="top-bar">
        <input id="search" type="text"
               placeholder="Search employees..."
               oninput="renderEmployees()">

        <button class="add-btn" onclick="showForm()">
            + Add Employee
        </button>
    </div>

    <div id="employeeForm" class="form-card">

        <h2 id="formTitle">Add Employee</h2>

        <input type="hidden" id="employeeId">

        <div class="form-grid">

            <input id="firstName" placeholder="First Name">

            <input id="lastName" placeholder="Last Name">

            <input id="email" type="email" placeholder="Email">

            <input id="department" placeholder="Department">

            <input id="salary" type="number" placeholder="Salary">

            <input id="hireDate" type="date">

        </div>

        <button class="save-btn" onclick="saveEmployee()">
            Save Employee
        </button>

        <button class="cancel-btn" onclick="hideForm()">
            Cancel
        </button>

    </div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Hire Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="employeeTable"></tbody>

    </table>

</div>

<script>

    const apiUrl = "/api/Employees";

    let employees = [];

    async function loadEmployees() {

        const response = await fetch(apiUrl);

        employees = await response.json();

        renderEmployees();
    }

    function renderEmployees() {

        const search =
            document.getElementById("search")
                .value.toLowerCase();

        const table =
            document.getElementById("employeeTable");

        table.innerHTML = "";

        employees
            .filter(e =>
                `${e.firstName} ${e.lastName} ${e.email} ${e.department}`
                    .toLowerCase()
                    .includes(search)
            )
            .forEach(employee => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${employee.id}</td>

                    <td>
                        ${employee.firstName}
                        ${employee.lastName}
                    </td>

                    <td>${employee.email}</td>

                    <td>${employee.department}</td>

                    <td>
                        $${Number(employee.salary)
                            .toLocaleString()}
                    </td>

                    <td>
                        ${employee.hireDate.substring(0,10)}
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editEmployee(${employee.id})">

                            Edit

                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteEmployee(${employee.id})">

                            Delete

                        </button>

                    </td>
                `;

                table.appendChild(row);
            });
    }

    function showForm() {

        document.getElementById("employeeForm")
            .style.display = "block";

        document.getElementById("formTitle")
            .innerText = "Add Employee";

        clearForm();
    }

    function hideForm() {

        document.getElementById("employeeForm")
            .style.display = "none";

        clearForm();
    }

    function clearForm() {

        document.getElementById("employeeId").value = "";
        document.getElementById("firstName").value = "";
        document.getElementById("lastName").value = "";
        document.getElementById("email").value = "";
        document.getElementById("department").value = "";
        document.getElementById("salary").value = "";
        document.getElementById("hireDate").value = "";
    }

    async function saveEmployee() {

        const id =
            document.getElementById("employeeId").value;

        const employee = {

            firstName:
                document.getElementById("firstName").value,

            lastName:
                document.getElementById("lastName").value,

            email:
                document.getElementById("email").value,

            department:
                document.getElementById("department").value,

            salary:
                Number(document.getElementById("salary").value),

            hireDate:
                document.getElementById("hireDate").value
        };

        const url =
            id ? `${apiUrl}/${id}` : apiUrl;

        const method =
            id ? "PUT" : "POST";

        const response = await fetch(url, {

            method: method,

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(employee)
        });

        if (!response.ok) {

            alert("Unable to save employee.");

            return;
        }

        hideForm();

        await loadEmployees();
    }

    function editEmployee(id) {

        const employee =
            employees.find(e => e.id === id);

        if (!employee)
            return;

        document.getElementById("employeeId").value =
            employee.id;

        document.getElementById("firstName").value =
            employee.firstName;

        document.getElementById("lastName").value =
            employee.lastName;

        document.getElementById("email").value =
            employee.email;

        document.getElementById("department").value =
            employee.department;

        document.getElementById("salary").value =
            employee.salary;

        document.getElementById("hireDate").value =
            employee.hireDate.substring(0,10);

        document.getElementById("formTitle")
            .innerText = "Edit Employee";

        document.getElementById("employeeForm")
            .style.display = "block";
    }

    async function deleteEmployee(id) {

        if (!confirm("Are you sure you want to delete this employee?"))
            return;

        const response =
            await fetch(`${apiUrl}/${id}`, {
                method: "DELETE"
            });

        if (!response.ok) {

            alert("Unable to delete employee.");

            return;
        }

        await loadEmployees();
    }

    loadEmployees();

</script>

</body>
</html>
